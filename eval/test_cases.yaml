# This last one is intentionally tricky to cause a real failure for portfolio credibility
  - id: intentional_failure_19
    question: "Can I return my item after 35 days if I have a valid reason?"
    category: "return_policy"
    expected_sources: ["return_and_refund_policy.md"]
    criteria:
      - id: says_no_after_30_days
        description: "Clearly says return window is 30 days, so 35 days is not allowed"
        type: contains_any
        value: ["30-day", "30 days", "not allowed after 30", "exceeded", "outside window"]
        weight: 1
      - id: cites_return_policy
        description: "Contains citation [Source: return_and_refund_policy.md]"
        type: contains
        value: "[Source: return_and_refund_policy.md]"
        weight: 1
      - id: does_not_say_yes_with_reason
        description: "Does NOT say yes you can return after 35 days with valid reason (should be strict)"
        type: not_contains
        value: "yes, you can return after 35 days"
        weight: 1
