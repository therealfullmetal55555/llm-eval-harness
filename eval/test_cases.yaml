# Eval test cases for RAG support bot
# Each case has question + criteria that judge will check
# Criteria must be verifiable, not vague like "answer is good"

test_cases:
  - id: return_window_01
    question: "What is your return window?"
    category: "return_policy"
    expected_sources: ["return_and_refund_policy.md"]
    criteria:
      - id: mentions_30_days
        description: "Answer mentions 30-day return window"
        type: contains
        value: "30-day"
        weight: 1
      - id: cites_return_policy
        description: "Answer contains citation [Source: return_and_refund_policy.md]"
        type: contains
        value: "[Source: return_and_refund_policy.md]"
        weight: 1
      - id: no_hallucinated_60_days
        description: "Answer does NOT mention 60-day return (hallucination check)"
        type: not_contains
        value: "60-day"
        weight: 1

  - id: refund_timeline_02
    question: "How long does refund take after you receive my return?"
    category: "return_policy"
    expected_sources: ["return_and_refund_policy.md"]
    criteria:
      - id: mentions_5_7_days
        description: "Answer mentions 5-7 business days for refund"
        type: contains
        value: "5-7"
        weight: 1
      - id: cites_return_policy
        description: "Answer contains citation [Source: return_and_refund_policy.md]"
        type: contains
        value: "[Source: return_and_refund_policy.md]"
        weight: 1

