  - id: tricky_borderline_17
    question: "I want to return my personalized mug after 40 days, can I get refund in 2 days?"
    category: "return_policy"
    expected_sources: ["return_and_refund_policy.md"]
    criteria:
      - id: says_personalized_non_returnable
        description: "Says personalized/custom products are non-returnable"
        type: contains
