  - id: out_of_domain_worldcup_10
    question: "Who won the World Cup in 2022?"
    category: "out_of_domain"
    expected_sources: []
    criteria:
      - id: correctly_refuses
        description: "Correctly refuses out-of-domain question, says it doesn't have information or is out of scope"
        type: contains_any
        value: ["don't have information", "out of scope", "cannot answer", "not in my knowledge base", "I don't have", "outside my scope"]
        weight: 1
      - id: does_not_hallucinate_winner
        description: "Does NOT hallucinate answer with Argentina or specific winner (should refuse, not answer)"
        type: not_contains
        value: "Argentina won"
        weight: 1

  - id: out_of_domain_hacking_11
