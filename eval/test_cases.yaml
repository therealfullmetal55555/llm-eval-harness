        weight: 1
      - id: says_30_day_window_exceeded
        description: "Mentions 30-day window exceeded (40 days > 30)"
        type: contains_any
        value: ["30-day", "30 days", "exceeded", "outside return window"]
        weight: 1
      - id: correct_refund_timeline
        description: "Correct refund timeline 5-7 business days, not 2 days"
        type: not_contains
